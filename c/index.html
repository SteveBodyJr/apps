<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Countdown – Until</title>
<meta name="description" content="A live countdown shared from Until, the countdown and count-up app.">
<meta name="robots" content="noindex">
<link rel="icon" href="../icons/until.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,1,0&display=block" rel="stylesheet">
<style>
  :root { --canvas: #F4F4F7; --card: #FFFFFF; --ink: #121217; --muted: #6E6E7A; --line: #E2E2E9; --orange: #F45D0B; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root { --canvas: #0B0B0F; --card: #17171D; --ink: #F4F4F7; --muted: #9C9CA8; --line: #2A2A33; color-scheme: dark; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--canvas); color: var(--ink); font-family: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 520px; margin: 0 auto; padding: 20px 16px calc(32px + env(safe-area-inset-bottom)); }
  .card { border-radius: 36px; padding: 26px 24px 30px; text-align: center; }
  .icon { width: 72px; height: 72px; border-radius: 50%; display: grid; place-items: center; margin: 4px auto 14px; }
  .icon span { font-size: 36px; }
  .tag { display: inline-block; padding: 5px 12px; border-radius: 999px; font-size: 12px; font-weight: 700; letter-spacing: .7px; text-transform: uppercase; }
  h1 { margin: 12px 0 0; font-size: 30px; line-height: 1.15; font-weight: 800; letter-spacing: -0.6px; overflow-wrap: anywhere; }
  .num { margin-top: 18px; font-size: clamp(72px, 26vw, 128px); line-height: 1; font-weight: 800; letter-spacing: -3px; font-variant-numeric: tabular-nums; }
  .cap { margin-top: 6px; font-size: 18px; font-weight: 700; opacity: .85; }
  .ticks { display: flex; justify-content: center; gap: 8px; margin-top: 22px; }
  .tick { min-width: 66px; padding: 9px 8px; border-radius: 16px; }
  .tick b { display: block; font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
  .tick small { font-size: 11px; font-weight: 700; opacity: .75; text-transform: uppercase; letter-spacing: .6px; }
  .when { margin-top: 18px; font-size: 15px; font-weight: 500; opacity: .85; }
  .actions { display: grid; gap: 10px; margin-top: 18px; }
  .btn { display: flex; align-items: center; justify-content: center; gap: 8px; height: 54px; border-radius: 999px; font: inherit; font-weight: 700; font-size: 16px; text-decoration: none; }
  .btn.primary { background: var(--ink); color: var(--canvas); }
  .btn.ghost { border: 1.5px solid var(--line); color: var(--ink); }
  .btn span.material-symbols-rounded { font-size: 20px; }
  .note { margin-top: 18px; text-align: center; color: var(--muted); font-size: 13px; line-height: 1.5; }
  .note a { color: var(--muted); }
  .brand { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 6px 0 16px; color: var(--muted); font-size: 14px; font-weight: 700; text-decoration: none; }
  .brand img { width: 22px; height: 22px; border-radius: 6px; }
  .empty { background: var(--card); border-radius: 28px; padding: 32px 24px; text-align: center; }
  .material-symbols-rounded { font-family: "Material Symbols Rounded"; font-weight: normal; font-style: normal; line-height: 1; letter-spacing: normal; text-transform: none; white-space: nowrap; direction: ltr; -webkit-font-smoothing: antialiased; }
</style>
</head>
<body>
<div class="wrap">
  <a class="brand" href="../#until"><img src="../icons/until.svg" alt=""> Until</a>
  <main id="main"></main>
  <p class="note">Shared with <a href="../#until">Until</a>, the countdown and count-up app by Digital Beaver.<br>The countdown lives in this link only; nothing is stored on a server.</p>
</div>
<script>
(() => {
  "use strict";
  // Mirrors Until's flat palettes (ui/theme/Theme.kt): [fill, on, darkFill, darkOn].
  const PALETTES = [
    ["#F45D0B", "#FFFFFF", "#F45D0B", "#FFFFFF"],
    ["#17171C", "#FFFFFF", "#2A2A33", "#FFFFFF"],
    ["#FFFFFF", "#121217", "#1C1C23", "#F4F4F7"],
    ["#B53C0A", "#FFFFFF", "#B53C0A", "#FFFFFF"],
    ["#FFE2C9", "#3D1B00", "#3A2414", "#FFD9BA"],
    ["#FFA41B", "#2A1500", "#FFA41B", "#2A1500"],
  ];
  // Until's icon keys -> Material Symbols names.
  const ICONS = { event: "event", folder: "folder", celebration: "celebration", cake: "cake", flight: "flight", beach: "beach_access",
    heart: "favorite", school: "school", home: "home", car: "directions_car", baby: "child_care", work: "work", book: "menu_book",
    fitness: "fitness_center", sprout: "spa", smokefree: "smoke_free", music: "music_note", tv: "tv", games: "sports_esports",
    football: "sports_soccer", card: "credit_card", phone: "smartphone", wifi: "wifi", cloud: "cloud", bank: "account_balance",
    receipt: "receipt", health: "local_hospital", alarm: "alarm", pets: "pets", world: "public", star: "star" };
  const SYMBOLS = { TZS: "TSh", KES: "KSh", UGX: "USh", RWF: "RF", USD: "$", EUR: "€", GBP: "£", ZAR: "R", INR: "₹" };
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const main = document.getElementById("main");
  const data = location.hash.slice(1);

  function decode(d) {
    const b64 = d.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((d.length + 3) % 4);
    const bytes = Uint8Array.from(atob(b64), (ch) => ch.charCodeAt(0));
    return JSON.parse(new TextDecoder().decode(bytes));
  }

  let m;
  try { m = decode(data); if (!m || m.v !== 1 || !m.t || !m.d) throw 0; } catch (e) { m = null; }
  if (!m) {
    main.innerHTML = '<div class="empty"><h1>This link is incomplete</h1><p class="note">Ask for the countdown to be shared again from Until.</p></div>';
    return;
  }

  const dark = matchMedia("(prefers-color-scheme: dark)").matches;
  const pal = PALETTES[((m.p | 0) % PALETTES.length + PALETTES.length) % PALETTES.length];
  const fill = dark ? pal[2] : pal[0], on = dark ? pal[3] : pal[1];
  const allDay = typeof m.m !== "number";
  const [y0, mo0, d0] = m.d.split("-").map(Number);
  const every = Math.max(1, m.e | 0 || 1);
  const repeats = m.r && m.r !== "NONE" && m.k !== "SINCE";

  // Occurrence n, counted from the first date (31 Jan -> 28 Feb -> 31 Mar), like Until.
  function dateOf(n) {
    const step = every * n;
    const clamp = (y, mo, d) => new Date(y, mo, Math.min(d, new Date(y, mo + 1, 0).getDate()));
    switch (repeats ? m.r : "NONE") {
      case "DAY": return new Date(y0, mo0 - 1, d0 + step);
      case "WEEK": return new Date(y0, mo0 - 1, d0 + 7 * step);
      case "MONTH": return clamp(y0, mo0 - 1 + step, d0);
      case "YEAR": return clamp(y0 + step, mo0 - 1, d0);
      default: return new Date(y0, mo0 - 1, d0);
    }
  }
  const at = (date) => allDay ? date : new Date(date.getFullYear(), date.getMonth(), date.getDate(), Math.floor(m.m / 60), m.m % 60);
  const startOfDay = (t) => new Date(t.getFullYear(), t.getMonth(), t.getDate());

  function position(now) {
    if (!repeats) return { target: at(dateOf(0)), n: 0 };
    let n = 0;
    const today = startOfDay(now);
    // Jump close, then step (cheap even for daily repeats).
    const approx = { DAY: 1, WEEK: 7, MONTH: 30.44, YEAR: 365.25 }[m.r] * every;
    n = Math.max(0, Math.floor((today - dateOf(0)) / 86400000 / approx) - 2);
    while (true) {
      const t = at(dateOf(n));
      if (allDay ? t >= today : t >= now) return { target: t, n };
      n++;
      if (n > 100000) return { target: t, n };
    }
  }

  const KIND = { EVENT: "Event", SINCE: "Count up", BIRTHDAY: "Birthday", SUBSCRIPTION: "Renews", DEADLINE: "Deadline" };
  const fmtDate = (t) => t.toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short", year: "numeric" }) +
    (allDay ? "" : " · " + t.toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" }));
  const plural = (n, w) => `${n.toLocaleString("en-US")} ${w}${n === 1 ? "" : "s"}`;

  document.title = `${m.t} – Until`;
  const icon = ICONS[m.i] || "event";
  const price = typeof m.$ === "number" ? `${SYMBOLS[m.c] || m.c || ""} ${(m.$ / 100).toLocaleString("en-US", { maximumFractionDigits: 2 })}`.trim() : "";

  main.innerHTML = `
    <section class="card" style="background:${fill};color:${on}">
      <div class="icon" style="background:${on}24"><span class="material-symbols-rounded" aria-hidden="true">${esc(icon)}</span></div>
      <span class="tag" id="tag" style="background:${on}24"></span>
      <h1>${esc(m.t)}</h1>
      <div class="num" id="num"></div>
      <div class="cap" id="cap"></div>
      <div class="ticks" id="ticks"></div>
      <div class="when" id="when"></div>
    </section>
    <div class="actions">
      <a class="btn primary" id="add" href="#"><span class="material-symbols-rounded" aria-hidden="true">add</span> Add to Until</a>
      <a class="btn ghost" href="../#until"><span class="material-symbols-rounded" aria-hidden="true">download</span> Get Until for Android</a>
    </div>`;

  // "Add to Until" opens the app (until://add?d=...); without it, Android's browser goes to the download page.
  const fallback = encodeURIComponent(location.origin + location.pathname.replace(/c\/?(index\.html)?$/, "") + "#until");
  document.getElementById("add").href = /Android/i.test(navigator.userAgent)
    ? `intent://add?d=${data}#Intent;scheme=until;package=com.digitalbeavertz.until;S.browser_fallback_url=${fallback};end`
    : "../#until";

  const el = (id) => document.getElementById(id);
  function tickBox(value, label) { return `<div class="tick" style="background:${on}24"><b>${value}</b><small>${label}</small></div>`; }

  function render() {
    const now = new Date();
    const { target, n } = position(now);
    const future = allDay ? startOfDay(target) > startOfDay(now) : target > now;
    const today = allDay && startOfDay(target).getTime() === startOfDay(now).getTime();
    const days = allDay ? Math.round(Math.abs(startOfDay(target) - startOfDay(now)) / 86400000)
                        : Math.floor(Math.abs(target - now) / 86400000);
    const word = future ? "until" : m.k === "DEADLINE" ? "overdue" : m.k === "SINCE" ? "since" : "ago";
    el("tag").textContent = (m.k === "DEADLINE" && !future && !today) ? "Overdue" : (KIND[m.k] || "Event");
    if (today) {
      el("num").textContent = "Today";
      el("cap").textContent = { BIRTHDAY: "birthday today", SUBSCRIPTION: "renews today", DEADLINE: "due today", SINCE: "it starts" }[m.k] || "it's the day";
      el("ticks").innerHTML = "";
    } else {
      el("num").textContent = days.toLocaleString("en-US");
      el("cap").textContent = `${days === 1 ? "day" : "days"} ${word}`;
      const ms = Math.abs(target - now);
      const pad = (x) => String(x).padStart(2, "0");
      el("ticks").innerHTML = tickBox(Math.floor(ms / 86400000).toLocaleString("en-US"), "days") +
        tickBox(pad(Math.floor(ms / 3600000) % 24), "hrs") + tickBox(pad(Math.floor(ms / 60000) % 60), "min") + tickBox(pad(Math.floor(ms / 1000) % 60), "sec");
    }
    const turns = m.k === "BIRTHDAY" && repeats && n > 0 ? ` · turns ${n}` : "";
    el("when").textContent = fmtDate(target) + turns + (price ? ` · ${price}` : "");
  }
  render();
  setInterval(render, 1000);
})();
</script>
</body>
</html>
